<app-header></app-header>

<div class="container my-5" style="max-width: 500px;">
  <h2 class="mb-4 text-center">Editar usuario</h2>
  <form #userForm="ngForm" (ngSubmit)="guardarUsuario()">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input id="nombre" name="nombre" class="form-control" required [(ngModel)]="nombre">
    </div>
    <div class="mb-3">
      <label for="apellidos" class="form-label">Apellidos</label>
      <input id="apellidos" name="apellidos" class="form-control" required [(ngModel)]="apellidos">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" name="email" type="email" class="form-control" required [(ngModel)]="email">
    </div>
    <div class="mb-3">
      <label for="telefono" class="form-label">Teléfono</label>
      <input id="telefono" name="telefono" class="form-control" [(ngModel)]="telefono">
    </div>
    <div class="mb-3">
      <label for="role" class="form-label">Rol</label>
      <select id="role" name="role" class="form-select" required [(ngModel)]="role">
        <option value="[ADMIN]">ADMIN</option>
        <option value="[USER]">USER</option>
        <option value="[PROPIETARIO]">PROPIETARIO</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary w-100">Guardar</button>
  </form>
</div>

<footer></footer>
