<app-header></app-header>

<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-white">
    <div class="w-100" style="max-width: 420px;">
        <div class="d-flex justify-content-center mb-3">
            <img [src]="logoPath" alt="Logo Flatbnb">
        </div>
        <h2 class="text-center mb-4 fw-bold" style="font-family: 'Google Sans', Arial, sans-serif;">Bienvenido de nuevo
        </h2>
        <form (ngSubmit)="procesaFormulario()">
            <div class="mb-3">
                <label for="username" class="form-label fw-medium">Nombre de usuario</label>
                <input type="text" class="form-control rounded-3 py-2" id="username" placeholder="Nombre de usuario"
                    [(ngModel)]="username" name="username" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-medium">Contraseña</label>
                <input type="password" class="form-control rounded-3 py-2" id="password" placeholder="Contraseña"
                    [(ngModel)]="password" name="password" required>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-danger rounded-pill py-2 fw-semibold"
                    style="font-size: 1.1rem;">Iniciar sesión</button>
            </div>
            <div class="d-grid">
                <button type="button" class="btn rounded-pill py-2 fw-semibold"
                    style="background: #f6f2f0; color: #7c6f65; font-size: 1.1rem;">Regístrate</button>
            </div>
        </form>
    </div>
</div>

<app-footer></app-footer>
