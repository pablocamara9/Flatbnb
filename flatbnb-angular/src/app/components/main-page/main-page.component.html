<app-header></app-header>
<div class="container-fluid min-vh-100 d-flex flex-column justify-content-between p-0 bg-white">
    <h2 class="mb-4 mt-5 text-center fw-bold">Top anuncios</h2>

    <!-- Filtros -->
    <div class="d-flex justify-content-center gap-2 mt-3 flex-wrap">
        <button class="btn btn-light rounded-pill px-3" (click)="ordenaMasCaros()">Más caros</button>
        <button class="btn btn-light rounded-pill px-3" (click)="ordenaMasBaratos()">Más baratos</button>
        <button class="btn btn-light rounded-pill px-3" (click)="ordenaMasEspaciosos()">Más espaciosos</button>
        <button class="btn btn-light rounded-pill px-3" (click)="ordenaMenosEspaciosos()">Menos espaciosos</button>
        <button class="btn btn-light rounded-pill px-3" (click)="ordenaMasHabitaciones()">Más habitaciones</button>
        <button class="btn btn-light rounded-pill px-3" (click)="ordenaMenosHabitaciones()">Menos habitaciones</button>
    </div>

    <!-- Tarjetas de propiedades -->
    <div class="container mt-4 flex-grow-1">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 justify-content-center">
            <ng-container *ngIf="anuncios.length > 0; else sinAnuncios">
                <div class="col" *ngFor="let anuncio of anuncios">
                    <div class="card h-100 border-0 shadow-none rounded-4"
                        style="cursor:pointer; min-height: 420px; max-width: 420px;" (click)="verDetalle(anuncio.id)">
                        <img [src]="anuncio.urlImagen || 'assets/placeholder.jpg'"
                            class="card-img-top rounded-4 property-img" alt="Imagen anuncio"
                            style="height: 260px; object-fit: cover;">
                        <div class="card-body p-0 pt-2">
                            <h6 class="card-title mb-1" style="font-size: 1.1rem;">
                                {{ anuncio.descripcion.split('.')[0] | slice:0:40 }}{{ anuncio.descripcion.length > 40 ?
                                '...' : '' }}
                            </h6>
                            <small style="font-size: 1rem;">{{ anuncio.precio | currency:'EUR':'symbol':'1.0-0' }} /
                                noche</small>
                        </div>
                    </div>
                </div>
            </ng-container>
            <ng-template #sinAnuncios>
                <div class="col-12 text-center text-muted py-5">
                    No hay anuncios disponibles.
                </div>
            </ng-template>
        </div>
        <!-- Controles de paginación -->
        <div class="d-flex justify-content-center mt-4" *ngIf="totalPaginas > 1">
            <nav>
                <ul class="pagination">
                    <li class="page-item" [class.disabled]="paginaActual === 0">
                        <button class="page-link" (click)="cambiarPagina(paginaActual - 1)"
                            [disabled]="paginaActual === 0">&laquo;</button>
                    </li>
                    <li class="page-item" *ngFor="let page of [].constructor(totalPaginas); let i = index"
                        [class.active]="i === paginaActual">
                        <button class="page-link" (click)="cambiarPagina(i)">{{ i + 1 }}</button>
                    </li>
                    <li class="page-item" [class.disabled]="paginaActual === totalPaginas - 1">
                        <button class="page-link" (click)="cambiarPagina(paginaActual + 1)"
                            [disabled]="paginaActual === totalPaginas - 1">&raquo;</button>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <app-footer></app-footer>
