<app-header></app-header>

<div class="container mt-4 d-flex flex-column align-items-center">
  <h2>Agregar Nuevo Anuncio</h2>
  <form (ngSubmit)="onSubmit()" #anuncioForm="ngForm" class="w-100" style="max-width: 700px;">
    <div class="mb-3 w-100">
      <label for="descripcion" class="form-label">Descripción</label>
      <textarea id="descripcion" class="form-control" name="descripcion" rows="3" required [(ngModel)]="anuncio.descripcion"></textarea>
    </div>
    <div class="mb-3 w-100">
      <label for="precio" class="form-label">Precio</label>
      <input type="number" id="precio" class="form-control" name="precio" required min="0" [(ngModel)]="anuncio.precio">
    </div>
    <div class="mb-3 w-100">
      <label for="imagenUrl" class="form-label">URL de la Imagen</label>
      <input type="url" id="imagenUrl" class="form-control" name="imagenUrl" required [(ngModel)]="anuncio.imagenUrl">
    </div>
    <button type="submit" class="btn btn-primary">Agregar Anuncio</button>
  </form>
</div>

<app-footer></app-footer>
